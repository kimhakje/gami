<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국사 타임 어드벤처 : 선사시대 보호막 대작전</title>
<style>
  :root{
    --bg1:#161029; --bg2:#241a4a; --gold:#ffd166; --meat:#ff6b6b;
    --shield:#4fc3f7; --card:#20153f; --card2:#2c1e5c; --text:#f5f1ff; --sub:#c3b8e6;
    --accent:#7d5fff; --good:#2ecc71; --bad:#e74c3c;
    --gold1:#D9B76A; --gold2:#B88A3D; --ivory:#F3EADB; --sub2:#AFA9BD; --locked-c:#716D7D;
    --exp:#45D5F4; --accent2:#4B8DFF; --accent3:#8C6CFF;
    --btnred1:#A13A3B; --btnred2:#8A2531; --btnred3:#651D28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Malgun Gothic','Segoe UI',sans-serif;
    background: radial-gradient(circle at 20% 0%, #ffffff 0%, #f6f4fb 45%, #ede8f8 100%);
    color:var(--text); display:flex; justify-content:center; padding:16px 16px 90px;
  }
  #app{ width:100%; max-width:880px; }
  @media (min-width:960px){ #app{ max-width:1040px; } body{ padding:28px 28px 100px; } }
  .card{
    background:linear-gradient(160deg,var(--card),var(--card2));
    border:2px solid #4a3690; border-radius:18px; padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); margin-bottom:16px;
  }
  h1{ text-align:center; font-size:27px; margin:8px 0 4px; text-shadow:0 2px 6px #000;}
  h2{ margin:0 0 10px; font-size:20px; color:var(--gold);}
  p{ line-height:1.7; color:var(--sub); font-size:15px; }
  .sub-title{ text-align:center; color:var(--sub); margin-bottom:16px; font-size:14px;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid #4a3690;
    background:#150a2e; color:var(--text); font-size:16px; margin:8px 0 14px;
  }
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    padding:12px 16px; font-size:15px; font-weight:700; transition:transform .08s, opacity .15s;
  }
  button:active{ transform:scale(.96); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-main{ background:linear-gradient(135deg,#7d5fff,#5433c7); color:#fff; width:100%; }
  .btn-gold{ background:linear-gradient(135deg,#ffd166,#f7a325); color:#3a2000; width:100%; }
  .btn-ghost{ background:#241a49; color:var(--sub); border:2px solid #4a3690; width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:8px; }
  .btn-row button{ flex:1; }
  .choice-btn{
    display:block; width:100%; text-align:left; background:#1c1240; color:var(--text);
    border:2px solid #453188; border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:15px;
  }
  .choice-btn.picked{ border-color:var(--accent); background:#2a1c5c; box-shadow:0 0 0 2px rgba(125,95,255,.4); }
  .choice-correct{ background:#183a24 !important; border-color:var(--good) !important; }
  .choice-wrong{ background:#3a1818 !important; border-color:var(--bad) !important; }
  .status-bar{
    display:flex; align-items:center; gap:10px; background:#150a2e; border-radius:14px;
    padding:10px 12px; margin-bottom:14px; border:1px solid #362463; flex-wrap:wrap;
  }
  .avatar-badge{ width:64px; height:76px; flex-shrink:0; }
  .status-mini{ font-size:12px; color:var(--sub); }
  .bar-track{ background:#241547; border-radius:8px; height:9px; overflow:hidden; width:100%; }
  .bar-fill{ height:100%; border-radius:8px; transition:width .3s; }
  .status-col{ flex:1; min-width:112px; }
  .pill{ background:#33206b; border-radius:999px; padding:4px 10px; font-size:11px; color:var(--gold); font-weight:700; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .avatar-pick{
    border:2px solid #322459; border-radius:18px; padding:10px 6px 12px; text-align:center; cursor:pointer;
    background:transparent; transition:transform .12s, border-color .12s;

  .avatar-pick:active{ transform:scale(.97); }
  .avatar-pick.selected{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,209,102,.25); }
  .avatar-pick .avatar-frame{

    display:flex; align-items:center; gap:12px; background:linear-gradient(160deg,#17142B,#201A38);
    border:1px solid var(--gold2); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.35);

    border-color:var(--accent2); background:linear-gradient(135deg, rgba(109,92,255,.22), rgba(75,141,255,.16));

  .stage-icon-tile{

  }
  .stage-arrow{ font-size:22px; color:var(--gold1); font-weight:900; }

  .map-ornate{
    background:radial-gradient(circle at 50% 0%, #15132B 0%, #101024 55%, #08081A 100%) !important;
    border:2px solid var(--gold1) !important; outline:1px solid var(--gold2); outline-offset:-6px;
    box-shadow:0 0 26px rgba(109,92,255,.14), 0 10px 30px rgba(0,0,0,.6) !important;
  }
  .map-title{
    text-align:center; font-size:22px; font-weight:800; margin:2px 0 14px; letter-spacing:1px;
    background:linear-gradient(135deg,var(--gold1),var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent;

  .note-item{ background:#1c1240; border:2px solid #453188; border-radius:12px; padding:12px; margin-bottom:10px; }

  .center{ text-align:center; }
  .mt8{ margin-top:8px; } .mt14{ margin-top:14px; }
  .sejong-portrait{ width:190px; height:247px; margin:0 auto; }

  .barrier-ring{ animation:pulse 2.2s ease-in-out infinite; pointer-events:none; }

<script>
'use strict';

/* =========================================================
   IMAGE ASSET AGENT — 업로드된 실제 일러스트 파일 사용
========================================================= */
function assetSrc(name){ return encodeURI('../image/' + name); }

function sejongImgHtml(){
  return `
  <div style="position:relative;width:100%;height:100%;">
    <div class="barrier-ring" style="position:absolute;inset:-8%;border-radius:50%;border:4px solid #4fc3f7;"></div>
    <div class="barrier-ring" style="position:absolute;inset:-2%;border-radius:50%;border:2px solid #4fc3f7;animation-delay:.3s;"></div>
    <img src="${assetSrc('새종대왕.png')}" alt="세종대왕" style="position:relative;width:100%;height:100%;object-fit:contain;border-radius:12px;"/>
  </div>`;
}

const GHOST_HUES = [0, 55, 150, 215];
function ghostImgHtml(stageIdx, opts){
  opts = opts || {};
  const hue = GHOST_HUES[stageIdx] || 0;
  return `<img src="${assetSrc('악령.jpg')}" alt="역사 악령" style="width:100%;height:100%;object-fit:contain;border-radius:10px;filter:hue-rotate(${hue}deg) saturate(1.3)${opts.angry?' contrast(1.15)':''};"/>`;
}

/* 흰 배경 일러스트를 캔버스로 열어 흰색을 투명하게 바꿔주는 유틸(다른 캐릭터들과 톤을 맞추기 위함) */
const BG_REMOVED_CACHE = {};
function loadTransparentBg(src, onReady){
  if(BG_REMOVED_CACHE[src]){ onReady(BG_REMOVED_CACHE[src]); return; }
  const img = new Image();
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const px = data.data;
      for(let i=0; i<px.length; i+=4){
        const d = 255 - Math.min(px[i], px[i+1], px[i+2]);
        if(d < 14) px[i+3] = 0;
        else if(d < 46) px[i+3] = Math.round(px[i+3] * (d-14) / 32);
      }
      ctx.putImageData(data, 0, 0);
      const url = canvas.toDataURL('image/png');
      BG_REMOVED_CACHE[src] = url;
      onReady(url);
    }catch(e){ console.error('[bg-remove] 실패', e); }
  };
  img.src = src;
}

function avatarImgHtml(avatar){
  const src = assetSrc(avatar.file);
  if(avatar.whiteBg){
    if(BG_REMOVED_CACHE[src]){
      return `<img src="${BG_REMOVED_CACHE[src]}" alt="${avatar.name}" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"/>`;
    }
    const uid = 'av' + Math.random().toString(36).slice(2);
    loadTransparentBg(src, url=>{ document.querySelectorAll(`img[data-avid="${uid}"]`).forEach(el=>{ el.src = url; }); });
    return `<img data-avid="${uid}" src="${src}" alt="${avatar.name}" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"/>`;
  }
  return `<img src="${src}" alt="${avatar.name}" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"/>`;
}

function ensureDaily(state){
  const today = new Date().toISOString().slice(0,10);
  if(!state.daily || state.daily.date !== today){
    state.daily = { date:today, questionsAnswered:0, wrongReviewed:0, bestStreak:0, currentStreak:0, claimed:{} };
  }
  return state.daily;
}

const Harness = {
  validate(state){
    if(!state) return state;
    state.meat = Math.max(0, Math.floor(state.meat || 0));
    state.totalMeatEarned = Math.max(0, Math.floor(state.totalMeatEarned || 0));
    state.barrierGauge = Math.min(100, Math.max(15, state.barrierGauge == null ? 80 : state.barrierGauge)); // 절대 0(붕괴)으로 두지 않음 → 막힘 방지
    state.barrierLevel = Math.min(9, Math.max(1, state.barrierLevel || 1));
    if(!Array.isArray(state.wrongNotes)) state.wrongNotes = [];
    if(!Array.isArray(state.ownedWeapons)) state.ownedWeapons = [];
    if(!Array.isArray(state.ownedCostumes)) state.ownedCostumes = [];
    if(!Array.isArray(state.ownedPets)) state.ownedPets = [];
    if(!Array.isArray(state.ownedBarrierUpgrades)) state.ownedBarrierUpgrades = [];
    if(!Array.isArray(state.clearedStages)) state.clearedStages = STAGES.map(()=>false);
    if(typeof state.storySeen !== 'boolean') state.storySeen = false;
    state.bossKills = Math.max(0, Math.floor(state.bossKills || 0));
    if(!Array.isArray(state.claimedAchievements)) state.claimedAchievements = [];
    ensureDaily(state);
    return state;
  },
  safeRun(fn, fallback){
    try{ fn(); }
    catch(err){
      console.error('[Harness] 오류를 감지하여 복구합니다:', err);
      try{ toast('⚠️ 문제가 있었지만 하네스가 바로 고쳐드렸어요!'); (fallback||renderMap)(); }
      catch(e2){ console.error('[Harness] 복구 실패', e2); }
    }
  }
};

/* =========================================================
   ORCHESTRATOR — 전역 상태 & 화면 제어
========================================================= */
const Orchestrator = {
  state: null,
  save(){
    if(!this.state) return;
    Harness.validate(this.state);
    localStorage.setItem('khist_save_' + this.state.nickname, JSON.stringify(this.state));
    const users = JSON.parse(localStorage.getItem('khist_users') || '[]');
    if(!users.includes(this.state.nickname)){ users.push(this.state.nickname); localStorage.setItem('khist_users', JSON.stringify(users)); }
  },
  load(nickname){
    const raw = localStorage.getItem('khist_save_' + nickname);
    return raw ? Harness.validate(JSON.parse(raw)) : null;
  },
  newState(nickname){
    return Harness.validate({
      nickname, avatar:null, meat:0, totalMeatEarned:0,
      barrierGauge:80, barrierLevel:1,
      currentStageIndex:0, clearedStages: STAGES.map(()=>false),
      wrongNotes:[], storySeen:false,
      ownedWeapons:[], equippedWeapon:null,
      ownedCostumes:[], equippedCostume:null,
      ownedPets:[], equippedPet:null,
      ownedBarrierUpgrades:[],
      correctFirstTry:0, correctTotal:0,
      bossKills:0, claimedAchievements:[],
      daily:null,
    });
  },
  rank(){
    const meat = this.state.totalMeatEarned;
    let r = RANKS[0];
    for(const cand of RANKS){ if(meat >= cand.min) r = cand; }
    return r.title;
  },
  earnMeat(n){
    this.state.meat += n;
    this.state.totalMeatEarned += n;
  },
  avatarInfo(){ return AVATARS.find(a=>a.id===this.state.avatar) || AVATARS[0]; },
  avatarImgHtml(){ return avatarImgHtml(this.avatarInfo()); },
  weaponDmg(){
    const w = WEAPONS.find(w=>w.id===this.state.equippedWeapon);
    return w ? w.dmg : 0;
  },
  petEmoji(){
    const p = PETS.find(p=>p.id===this.state.equippedPet);
    return p ? p.emoji : '';

};

/* =========================================================
   AGENT: 퀴즈 및 전투
========================================================= */
let quizSession = null; // {stageIdx, queue:[qIdx...], selected, showExplain, wasWrongThisQ, lastReward, lastCorrect}
const QuizAgent = {
  start(stageIdx){
    const order = STAGES[stageIdx].questions.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    quizSession = { stageIdx, queue: order, selected:null, showExplain:false, wasWrongThisQ:false };
    renderQuiz();
  },
  pick(choiceIdx){
    if(quizSession.showExplain) return;
    quizSession.selected = choiceIdx;
    renderQuiz();
  },
  confirm(){
    if(quizSession.selected == null || quizSession.showExplain) return;
    const stage = STAGES[quizSession.stageIdx];
    const qIdx = quizSession.queue[0];
    const q = stage.questions[qIdx];
    const key = stage.id + '-' + qIdx;
    const correct = quizSession.selected === q.answer;
    quizSession.showExplain = true;
    quizSession.lastQIdx = qIdx;
    quizSession.lastCorrect = correct;

    let note = Orchestrator.state.wrongNotes.find(n=>n.key===key);
    const wasWrongBefore = !!note;
    const daily = ensureDaily(Orchestrator.state);
    daily.questionsAnswered += 1;
    if(correct){
      const reward = quizSession.wasWrongThisQ ? 8 : 15;
      Orchestrator.earnMeat(reward);
      Orchestrator.state.correctTotal += 1;
      if(!quizSession.wasWrongThisQ) Orchestrator.state.correctFirstTry += 1;
      Orchestrator.state.barrierGauge = Math.min(100, Orchestrator.state.barrierGauge + 4);
      if(note) note.cleared = true;
      if(wasWrongBefore) daily.wrongReviewed += 1;
      daily.currentStreak += 1;
      daily.bestStreak = Math.max(daily.bestStreak, daily.currentStreak);
      quizSession.lastReward = reward;
      quizSession.queue.shift();
    } else {
      const dmg = Math.max(2, 8 - Orchestrator.state.barrierLevel);
      Orchestrator.state.barrierGauge = Math.max(15, Orchestrator.state.barrierGauge - dmg);
      if(!note){ note = { key, era: stage.name, question:q.q, answerText:q.choices[q.answer], explain:q.explain, missCount:0, cleared:false }; Orchestrator.state.wrongNotes.push(note); }
      note.missCount += 1; note.cleared = false;
      daily.currentStreak = 0;
      quizSession.wasWrongThisQ = true;
    }
    Orchestrator.save();
    renderQuiz();
  },
  next(){
    if(!quizSession) return;
    if(quizSession.queue.length === 0){ renderStageClearTransition(quizSession.stageIdx); return; }
    quizSession.selected = null; quizSession.showExplain = false; quizSession.wasWrongThisQ = false;
    renderQuiz();
  }
};

/* =========================================================
   AGENT: 훈련장 (시간제한 없는 복습 모드)
========================================================= */
let trainSession = null; // {items:[{stageIdx,qIdx}], idx, selected, showExplain, correctCount, title}
const TrainAgent = {
  startStage(stageIdx){
    const items = STAGES[stageIdx].questions.map((_,i)=>({stageIdx, qIdx:i}));
    TrainAgent._begin(items, STAGES[stageIdx].name + ' 복습');
  },
  startAll(){
    const items = [];
    STAGES.forEach((stage, si)=> stage.questions.forEach((_, qi)=> items.push({stageIdx:si, qIdx:qi})));
    TrainAgent._begin(items, '전체 랜덤 복습');
  },
  startWrongNotes(){
    const notes = Orchestrator.state.wrongNotes.filter(n=>!n.cleared);
    if(notes.length===0){ toast('복습할 오답이 없어요! 완벽해요 👏'); renderTrainHome(); return; }
    const items = notes.map(n=>{
      const sepIdx = n.key.lastIndexOf('-');
      const stageId = n.key.slice(0, sepIdx);
      const qIdx = Number(n.key.slice(sepIdx+1));
      return { stageIdx: STAGES.findIndex(s=>s.id===stageId), qIdx };
    }).filter(it=>it.stageIdx>=0);
    TrainAgent._begin(items, '오답노트 복습');
  },
  _begin(items, title){
    for(let i=items.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    trainSession = { items, idx:0, selected:null, showExplain:false, correctCount:0, title };
    renderTrain();
  },
  pick(choiceIdx){
    if(trainSession.showExplain) return;
    trainSession.selected = choiceIdx;
    renderTrain();
  },
  confirm(){
    if(trainSession.selected == null || trainSession.showExplain) return;
    const cur = trainSession.items[trainSession.idx];
    const q = STAGES[cur.stageIdx].questions[cur.qIdx];
    trainSession.showExplain = true;
    trainSession.lastCorrect = trainSession.selected === q.answer;
    if(trainSession.lastCorrect) trainSession.correctCount += 1;
    renderTrain();
  },
  next(){
    trainSession.idx += 1;
    trainSession.selected = null; trainSession.showExplain = false;
    if(trainSession.idx >= trainSession.items.length){ renderTrainResult(); return; }
    renderTrain();
  }
};

    Orchestrator.state.equippedCostume = id;

  },
  equipCostume(id){ Orchestrator.state.equippedCostume = (Orchestrator.state.equippedCostume===id? null : id); Orchestrator.save(); renderShop(); },

  },

  buyConsumable(id){

/* =========================================================
   AGENT: 일일 임무
========================================================= */
const DailyAgent = {
  claim(id){
    const mission = DAILY_MISSIONS.find(m=>m.id===id); if(!mission) return;
    const daily = ensureDaily(Orchestrator.state);
    if(daily.claimed[id]) return;
    if(mission.progress(daily) < mission.target){ toast('아직 완료하지 못했어요!'); return; }
    daily.claimed[id] = true;
    Orchestrator.earnMeat(mission.reward);
    Orchestrator.save(); toast(`📅 ${mission.name} 완료! 고기 +${mission.reward}`); renderDaily();
  }
};

   AGENT: 업적
========================================================= */
const AchievementAgent = {
  claim(id){
    const ach = ACHIEVEMENTS.find(a=>a.id===id); if(!ach) return;
    const s = Orchestrator.state;
    if(s.claimedAchievements.includes(id)) return;

/* =========================================================
   AGENT: 미니게임 (보호막 방어전)
========================================================= */
let battle = null; // {stageIdx, ghostHp, ghostMax, timeLeft, timerId, over, won}
const BattleAgent = {
  start(stageIdx){
    if(battle && battle.timerId) clearInterval(battle.timerId);
    battle = { stageIdx, ghostHp:32, ghostMax:32, timeLeft:14, timerId:null, over:false, won:false };
    renderBattle();
    battle.timerId = setInterval(()=>{
      battle.timeLeft -= 1;
      if(battle.timeLeft <= 0){ BattleAgent.finish(false); return; }
      renderBattle();
    }, 1000);
  },
  hit(){
    if(!battle || battle.over) return;
    const dmg = 2 + Math.floor(Math.random()*4) + Orchestrator.weaponDmg();
    battle.ghostHp = Math.max(0, battle.ghostHp - dmg);
    if(battle.ghostHp === 0){ BattleAgent.finish(true); return; }
    renderBattle();
  },
  finish(won){
    if(battle.timerId) clearInterval(battle.timerId);
    battle.over = true; battle.won = won;
    if(won){
      Orchestrator.earnMeat(30);
      Orchestrator.state.barrierGauge = 100;
      Orchestrator.state.clearedStages[battle.stageIdx] = true;
      Orchestrator.state.bossKills += 1;
      Orchestrator.save();
    } else {
      Orchestrator.state.barrierGauge = Math.max(15, Orchestrator.state.barrierGauge - 10);
      Orchestrator.save();
    }
    renderBattle();
  },
  retry(){ BattleAgent.start(battle.stageIdx); }
};

}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1800);
}
function bannerHtml(name, alt){
  return `<div class="login-banner"><img src="${assetSrc(name)}" alt="${alt||''}" style="width:100%;display:block;"/></div>`;
}
function renderBottomNav(active){
  let el = document.getElementById('bottomNav');
  if(!active){ if(el) el.remove(); return; }
  const tabs = [
    { key:'map', label:'지도', ic:'🗺️', fn:'renderMap' },
    { key:'train', label:'훈련장', ic:'🎯', fn:'renderTrainHome' },

function renderQuiz(){
  const stage = STAGES[quizSession.stageIdx];
  const qIdx = quizSession.showExplain ? quizSession.lastQIdx : quizSession.queue[0];
  const q = stage.questions[qIdx];
  const total = stage.questions.length;
  const remaining = quizSession.queue.length;
  const progress = Math.round(((total - remaining) / total) * 100);

  const choicesHtml = q.choices.map((c, i)=>{
    let cls = 'choice-btn';
    if(quizSession.showExplain){
      if(i === q.answer) cls += ' choice-correct';
      else if(i === quizSession.selected) cls += ' choice-wrong';
    } else if(i === quizSession.selected){
      cls += ' picked';
    }
    const disabled = quizSession.showExplain ? 'disabled' : '';
    return `<button class="${cls}" ${disabled} onclick="Harness.safeRun(()=>QuizAgent.pick(${i}))">${String.fromCharCode(9312+i)} ${c}</button>`;
  }).join('');

  let actionBlock = '';
  if(!quizSession.showExplain){
    actionBlock = `<button class="btn-gold mt8" ${quizSession.selected==null?'disabled':''} onclick="Harness.safeRun(QuizAgent.confirm)">✅ 정답 확인</button>`;
  } else {
    const correct = quizSession.lastCorrect;
    actionBlock = `
      <div class="card" style="border-color:${correct?'var(--good)':'var(--bad)'};margin-top:14px;">
        <b>${correct ? '✅ 정답이에요! 참 잘했어요!' : '❌ 아쉬워요, 다시 도전해봐요!'}</b>
        <p>${q.explain}</p>
        ${correct ? `<p class="tag" style="color:var(--gold)">🍖 고기 +${quizSession.lastReward} 획득! 보호막 +4</p>` : `<p class="tag" style="color:var(--bad)">🛡️ 보호막이 조금 흔들렸어요...</p>`}
        <button class="btn-main" onclick="Harness.safeRun(QuizAgent.next)">${correct ? (remaining<=0 ? '👻 보호막 방어전으로!' : '다음 문제 →') : '🔁 이 문제 다시 풀기'}</button>
      </div>`;
  }

  mount(`
    <h1>${stage.name} 퀴즈</h1>
    ${statusBar()}
    <div class="card">
      <div class="bar-track mt8"><div class="bar-fill" style="width:${progress}%;background:var(--gold);"></div></div>
      <p class="tag" style="margin:6px 0 14px;">${total - remaining} / ${total} 문제 완료</p>
      <h2>Q. ${q.q}</h2>
      ${choicesHtml}
      ${!quizSession.showExplain ? actionBlock : ''}
    </div>
    ${quizSession.showExplain ? actionBlock : ''}
    <button class="btn-ghost" onclick="Harness.safeRun(renderMap)">← 지도로 돌아가기 (진행상황은 저장돼요)</button>
  `, { light:true });
}

function shopOverlayHtml(tabKey){
  const info = SHOP_TABS_INFO[tabKey];
  const tpl = SHOP_TEMPLATES[info.template];
  const s = Orchestrator.state;

  const tabButtons = Object.keys(tpl.tabs).map(k=>{
    const r = tpl.tabs[k];
    return `<button aria-label="${k}" onclick="Harness.safeRun(()=>{shopTab='${k}'; renderShop();})"
      style="position:absolute;left:${r.l}%;top:${r.t}%;width:${r.w}%;height:${r.h}%;background:transparent;border:none;padding:0;margin:0;cursor:pointer;"></button>`;
  }).join('');

  let itemButtons = '';
  info.data.forEach((item, idx)=>{
    const row = idx < 4 ? 0 : 1;
    const col = idx % 4;
    const top = tpl.grid.rowTop[row];
    const left = tpl.grid.colLeft[col];
    let onClick = '', badge = '';
    if(info.mode === 'consumable'){
      onClick = `EconomyAgent.buyConsumable('${item.id}')`;
    } else if(info.mode === 'barrier'){
      const owned = s.ownedBarrierUpgrades.includes(item.id);
      const locked = idx>0 && !s.ownedBarrierUpgrades.includes(BARRIER_UPGRADES[idx-1].id);
      if(!owned && !locked) onClick = `EconomyAgent.buyBarrier('${item.id}')`;
      if(owned) badge = `<div style="position:absolute;left:${left}%;top:${top-4.2}%;width:${tpl.grid.colW}%;text-align:center;color:#2ecc71;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;">✅ 강화완료</div>`;
      else if(locked) badge = `<div style="position:absolute;left:${left}%;top:${top-4.2}%;width:${tpl.grid.colW}%;text-align:center;color:#AFA9BD;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;">🔒 잠김</div>`;
    } else { // equip: costume / pet
      const ownedArr = tabKey==='costume' ? s.ownedCostumes : s.ownedPets;
      const equippedId = tabKey==='costume' ? s.equippedCostume : s.equippedPet;
      const owned = ownedArr.includes(item.id);
      const equipped = equippedId === item.id;
      const buyFn = tabKey==='costume' ? 'EconomyAgent.buyCostume' : 'EconomyAgent.buyPet';
      const equipFn = tabKey==='costume' ? 'EconomyAgent.equipCostume' : 'EconomyAgent.equipPet';
      onClick = owned ? `${equipFn}('${item.id}')` : `${buyFn}('${item.id}')`;
      if(equipped) badge = `<div style="position:absolute;left:${left}%;top:${top-4.2}%;width:${tpl.grid.colW}%;text-align:center;color:#ffd166;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;">⭐ 장착중</div>`;
      else if(owned) badge = `<div style="position:absolute;left:${left}%;top:${top-4.2}%;width:${tpl.grid.colW}%;text-align:center;color:#2ecc71;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;">✅ 보유</div>`;
    }
    itemButtons += `${badge}<button aria-label="${item.name}" ${onClick?`onclick="Harness.safeRun(()=>${onClick})"`:'disabled'}
      style="position:absolute;left:${left}%;top:${top}%;width:${tpl.grid.colW}%;height:${tpl.grid.rowH}%;background:transparent;border:none;padding:0;margin:0;cursor:${onClick?'pointer':'default'};"></button>`;
  });

  const meatBoxStyle = 'position:absolute;display:flex;align-items:center;justify-content:center;background:#0c0a18;border-radius:6px;color:#ff8a8a;font-weight:800;';
  const meatCover = `<div style="${meatBoxStyle}left:${tpl.meat.l}%;top:${tpl.meat.t}%;width:${tpl.meat.w}%;height:${tpl.meat.h}%;font-size:13px;">🍖 보유 고기 ${s.meat}</div>`;
  const meatTopCover = tpl.meatTop ? `<div style="${meatBoxStyle}left:${tpl.meatTop.l}%;top:${tpl.meatTop.t}%;width:${tpl.meatTop.w}%;height:${tpl.meatTop.h}%;font-size:12px;">🍖 고기 ${s.meat}</div>` : '';

  return `
    <div class="login-banner" style="position:relative;">
      <img src="${assetSrc(info.image)}" alt="상점" style="width:100%;display:block;"/>
      <button aria-label="뒤로" onclick="Harness.safeRun(renderMap)"
        style="position:absolute;left:${tpl.back.l}%;top:${tpl.back.t}%;width:${tpl.back.w}%;height:${tpl.back.h}%;background:transparent;border:none;padding:0;margin:0;cursor:pointer;"></button>
      ${tabButtons}
      ${itemButtons}
      ${meatCover}
      ${meatTopCover}
    </div>`;
}

function renderEquip(){
  const s = Orchestrator.state;
  function section(title, items, ownedIds, equippedId, equipFn){

    if(owned.length===0){
      return `<h2>${title}</h2><p class="tag">아직 보유한 아이템이 없어요. 상점에서 구매해보세요!</p>`;

  }
  mount(`
    <h1>🎽 내 캐릭터 착용창</h1>
    ${statusBar()}
    <div class="card center">
      ${equippedPreviewHtml()}
    </div>
    <div class="card">${section('⚔️ 무기', WEAPONS, s.ownedWeapons, s.equippedWeapon, 'EconomyAgent.equipWeapon')}</div>
    <div class="card">${section('👘 의상', COSTUMES, s.ownedCostumes, s.equippedCostume, 'EconomyAgent.equipCostume')}</div>
    <div class="card">${section('🐾 펫', PETS, s.ownedPets, s.equippedPet, 'EconomyAgent.equipPet')}</div>
    <button class="btn-main" onclick="Harness.safeRun(renderShop)">🛍️ 상점 가서 더 구매하기</button>
  `, { nav:'equip' });
}

function renderDaily(){
  const s = Orchestrator.state;
  const daily = ensureDaily(s);
  const bodyHtml = DAILY_MISSIONS.map(m=>{
    const cur = Math.min(m.progress(daily), m.target);
    const pct = Math.round((cur / m.target) * 100);
    const claimed = !!daily.claimed[m.id];
    const done = cur >= m.target;
    return `
    <div class="ach-card ${done?'done':''}">
      <div class="ach-icon">${m.icon}</div>
      <div class="ach-info">
        <div class="ach-name">${m.name}</div>
        <div class="bar-track mt8"><div class="bar-fill" style="width:${pct}%;background:${done?'var(--good)':'var(--exp)'};"></div></div>
        <small class="tag">${cur} / ${m.target}</small>
      </div>
      <div class="ach-action">
        ${claimed ? `<span class="badge-clear">완료</span>` : (done ? `<button class="btn-gold" style="width:auto;" onclick="Harness.safeRun(()=>DailyAgent.claim('${m.id}'))">🍖 +${m.reward}</button>` : `<small class="tag">🍖 ${m.reward}</small>`)}
      </div>
    </div>`;
  }).join('');

  mount(`
    <h1>📅 일일 임무</h1>
    ${statusBar()}
    <div class="card">
      <p class="tag">매일 자정에 초기화돼요. 오늘 안에 임무를 완료하고 고기를 받아가세요!</p>
    </div>
    <div class="card">${bodyHtml}</div>
    <button class="btn-ghost" onclick="Harness.safeRun(renderMap)">← 지도로 돌아가기</button>
  `, { light:true });
}

let achieveTab = 'achieve';
function renderAchievements(){
  const s = Orchestrator.state;
  let bodyHtml = '';
  if(achieveTab === 'achieve'){
    bodyHtml = ACHIEVEMENTS.map(a=>{
      const cur = Math.min(a.progress(s), a.target);
      const pct = Math.round((cur / a.target) * 100);
      const claimed = s.claimedAchievements.includes(a.id);
      const done = cur >= a.target;
      return `
      <div class="ach-card ${done?'done':''}">
        <div class="ach-icon">${a.icon}</div>
        <div class="ach-info">
          <div class="ach-name">${a.name}</div>
          <small class="tag">${a.desc}</small>
          <div class="bar-track mt8"><div class="bar-fill" style="width:${pct}%;background:${done?'var(--good)':'var(--exp)'};"></div></div>
          <small class="tag">${cur} / ${a.target}</small>
        </div>
        <div class="ach-action">
          ${claimed ? `<span class="badge-clear">완료</span>` : (done ? `<button class="btn-gold" style="width:auto;" onclick="Harness.safeRun(()=>AchievementAgent.claim('${a.id}'))">🍖 +${a.reward}</button>` : `<small class="tag">🍖 ${a.reward}</small>`)}
        </div>
      </div>`;
    }).join('');
  } else {
    bodyHtml = RANKS.map(r=>{
      const active = Orchestrator.rank() === r.title;
      const unlocked = s.totalMeatEarned >= r.min;
      return `
      <div class="ach-card ${active?'done':''}">
        <div class="ach-icon">${active?'👑':(unlocked?'🎖️':'🔒')}</div>
        <div class="ach-info">
          <div class="ach-name">${r.title}</div>
          <small class="tag">${unlocked ? '누적 고기 '+r.min+' 이상' : '누적 고기 '+r.min+' 필요 (현재 '+s.totalMeatEarned+')'}</small>
        </div>
        <div class="ach-action">${active ? '<span class="badge-clear">장착중</span>' : (unlocked ? '<small class="tag">달성함</small>' : '<small class="tag">🔒 잠김</small>')}</div>
      </div>`;
    }).join('');
  }

  mount(`
    <h1>🏆 업적 · 칭호</h1>
    ${statusBar()}
    <div class="shop-tabs">
      <button class="shop-tab ${achieveTab==='achieve'?'active':''}" onclick="Harness.safeRun(()=>{achieveTab='achieve'; renderAchievements();})">🏆 업적</button>
      <button class="shop-tab ${achieveTab==='rank'?'active':''}" onclick="Harness.safeRun(()=>{achieveTab='rank'; renderAchievements();})">👑 칭호</button>
    </div>
    <div class="card">${bodyHtml}</div>
  `, { nav:'achieve' });
}

function renderTrainHome(){
  const s = Orchestrator.state;
  const wrongCount = s.wrongNotes.filter(n=>!n.cleared).length;
  mount(`
    <h1>🎯 훈련장</h1>
    ${statusBar()}
    <div class="card">
      <h2>편하게 복습해보세요</h2>
      <p class="tag">시간제한도 없고 틀려도 보호막이 깎이지 않아요. 대신 고기는 주지 않아요.</p>
      <button class="btn-main" onclick="Harness.safeRun(TrainAgent.startAll)">🔀 전체 랜덤 복습</button>
      ${wrongCount>0 ? `<button class="btn-gold mt8" onclick="Harness.safeRun(TrainAgent.startWrongNotes)">📕 오답노트 복습 (${wrongCount}문제)</button>` : ''}
      <button class="btn-ghost mt8" onclick="Harness.safeRun(renderWorksheetSelect)">📝 빈칸 시험지 만들기</button>
    </div>
    <div class="card">
      <h2>시대별 복습</h2>
      ${STAGES.map((stage,idx)=>`
        <div class="stage-row" onclick="Harness.safeRun(()=>TrainAgent.startStage(${idx}))">
          <div class="stage-icon-tile">${ghostImgHtml(idx)}</div>
          <div class="info">
            <div><b>${stage.name}</b> <small class="tag">(${stage.tag})</small></div>
            <small class="tag">문제 ${stage.questions.length}개</small>
          </div>
          <span class="stage-arrow">›</span>
        </div>
      `).join('')}
    </div>
  `, { nav:'train', light:true });
}

function renderTrain(){
  const cur = trainSession.items[trainSession.idx];
  const stage = STAGES[cur.stageIdx];
  const q = stage.questions[cur.qIdx];
  const total = trainSession.items.length;

  const choicesHtml = q.choices.map((c, i)=>{
    let cls = 'choice-btn';
    if(trainSession.showExplain){
      if(i === q.answer) cls += ' choice-correct';
      else if(i === trainSession.selected) cls += ' choice-wrong';
    } else if(i === trainSession.selected){
      cls += ' picked';
    }
    const disabled = trainSession.showExplain ? 'disabled' : '';
    return `<button class="${cls}" ${disabled} onclick="Harness.safeRun(()=>TrainAgent.pick(${i}))">${String.fromCharCode(9312+i)} ${c}</button>`;
  }).join('');

  let actionBlock = '';
  if(!trainSession.showExplain){
    actionBlock = `<button class="btn-gold mt8" ${trainSession.selected==null?'disabled':''} onclick="Harness.safeRun(TrainAgent.confirm)">✅ 정답 확인</button>`;
  } else {
    const correct = trainSession.lastCorrect;
    actionBlock = `
      <div class="card" style="border-color:${correct?'var(--good)':'var(--bad)'};margin-top:14px;">
        <b>${correct ? '✅ 정답이에요!' : '❌ 아쉬워요!'}</b>
        <p>${q.explain}</p>
        <button class="btn-main" onclick="Harness.safeRun(TrainAgent.next)">${trainSession.idx+1>=total ? '결과 보기' : '다음 문제 →'}</button>
      </div>`;
  }

  mount(`
    <h1>🎯 ${trainSession.title}</h1>
    <div class="card">
      <p class="tag" style="margin:0 0 14px;">${trainSession.idx+1} / ${total} 문제 · ${stage.name}</p>
      <h2>Q. ${q.q}</h2>
      ${choicesHtml}
      ${!trainSession.showExplain ? actionBlock : ''}
    </div>
    ${trainSession.showExplain ? actionBlock : ''}
    <button class="btn-ghost" onclick="Harness.safeRun(renderTrainHome)">← 훈련장으로 돌아가기</button>
  `, { light:true });
}

function renderTrainResult(){
  const total = trainSession.items.length;
  const correct = trainSession.correctCount;
  mount(`
    <h1>🎯 훈련 완료!</h1>
    ${statusBar()}
    <div class="card center">
      <h2>${trainSession.title}</h2>
      <p style="font-size:32px;font-weight:800;color:var(--gold);">${correct} / ${total}</p>
      <p class="tag">${correct===total ? '완벽해요! 👏' : '꾸준히 복습하면 실력이 쑥쑥 늘어요!'}</p>
      <button class="btn-main" onclick="Harness.safeRun(renderTrainHome)">🔁 다시 훈련하기</button>
      <button class="btn-ghost mt8" onclick="Harness.safeRun(renderMap)">🗺️ 지도로 돌아가기</button>
    </div>
  `, { light:true });
}

function renderWorksheetSelect(){
  mount(`
    <h1>📝 빈칸 시험지 만들기</h1>
    ${statusBar()}
    <div class="card">
      <p class="tag">시대를 고르면 그동안 배운 내용으로 시험지를 만들어드려요. 인쇄해서 실제 시험처럼 풀어보세요!</p>
      ${STAGES.map((stage,idx)=>`
        <div class="stage-row" onclick="Harness.safeRun(()=>renderWorksheet(${idx}))">
          <div class="stage-icon-tile">${ghostImgHtml(idx)}</div>
          <div class="info">
            <div><b>${stage.name}</b></div>
            <small class="tag">문제 ${stage.questions.length}개</small>
          </div>
          <span class="stage-arrow">›</span>
        </div>
      `).join('')}
    </div>
    <button class="btn-ghost" onclick="Harness.safeRun(renderTrainHome)">← 훈련장으로</button>
  `, { light:true });
}

function renderWorksheet(stageIdx){
  const stage = STAGES[stageIdx];
  const s = Orchestrator.state;
  const dateStr = new Date().toLocaleDateString('ko-KR');
  mount(`
    <div class="worksheet-paper">
      <div class="worksheet-title">한국사 빈칸 시험지</div>
      <div class="worksheet-subject"><span>주제: ${stage.name} (${stage.tag})</span></div>
      <div class="worksheet-fields">
        <span>이름: ${s.nickname}</span>
        <span>날짜: ${dateStr}</span>
        <span class="worksheet-score">점수: ___ / ${stage.questions.length * 10}</span>
      </div>
      <p class="worksheet-instruction">다음 질문을 읽고 알맞은 답을 빈칸에 쓰세요.</p>
      <ol class="worksheet-list">
        ${stage.questions.map(q=>`<li>${q.q}<div class="ws-blank">→ 정답: <span class="ws-line">&nbsp;</span></div></li>`).join('')}
      </ol>
      <button class="btn-gold no-print" onclick="this.nextElementSibling.classList.toggle('show')">✅ 정답 확인하기</button>
      <div class="worksheet-answers">
        <b>정답</b>
        <ol>${stage.questions.map(q=>`<li>${q.choices[q.answer]} — ${q.explain}</li>`).join('')}</ol>
      </div>
    </div>
    <button class="btn-main no-print" onclick="window.print()">🖨️ 인쇄하기</button>
    <button class="btn-ghost mt8 no-print" onclick="Harness.safeRun(renderWorksheetSelect)">← 다른 시대 선택</button>
  `, { light:true });
}

function renderWrongNotes(){
  const notes = Orchestrator.state.wrongNotes.slice().sort((a,b)=> (a.cleared - b.cleared));
  mount(`
    <h1>📕 오답노트</h1>
    ${statusBar()}
    <div class="card">
      ${notes.length === 0 ? '<p>아직 틀린 문제가 없어요! 완벽해요 👏</p>' : notes.map(n=>`
        <div class="note-item ${n.cleared?'cleared':''}">
          <small class="tag">${n.era} · 틀린 횟수 ${n.missCount}회 ${n.cleared?'· ✅ 극복 완료':'· ⏳ 다시 도전 필요'}</small>
          <p><b>${n.question}</b></p>
          <p class="tag">정답: ${n.answerText} — ${n.explain}</p>
        </div>
      `).join('')}
    </div>
  `, { nav:'notes' });
}
